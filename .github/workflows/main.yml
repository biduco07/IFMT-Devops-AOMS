# Build da aplicação Angular e deploy no GitHub Pages.
# - Em pull requests (para a main ou a dev): só faz o build, para garantir que nada quebrou.
# - Em push na main (ou execução manual): faz o build e publica no Pages.
name: Build e deploy no GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Apenas um deploy por vez; não cancela um deploy que já está em andamento.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Configurar Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # O base href precisa ser o caminho do site no Pages (/IFMT-Devops-AOMS/).
      - name: Build de produção
        run: npx ng build --configuration production --base-href "${BASE_PATH:-/IFMT-Devops-AOMS}/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Enviar artefato do site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/trabalho-facul/browser

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
